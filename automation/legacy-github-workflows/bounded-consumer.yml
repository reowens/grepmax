name: Bounded cleanup package compatibility

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      native-run-id:
        description: Successful optimized native qualification run for this exact source
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  packaged-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.18'
      - run: pnpm install --frozen-lockfile
      - name: Download exact-source native acceptance artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: bounded-native-*
          path: ${{ runner.temp }}/bounded-artifacts
          run-id: ${{ inputs.native-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble optimized accepted native cleanup
        run: node scripts/assemble-bounded-runtime.cjs "$RUNNER_TEMP/bounded-artifacts" lance-maintenance/artifacts
      - run: pnpm build
      - run: node scripts/prepare-bounded-runtime.cjs --required
      - name: Verify actual packaged Node readers and native cleanup
        run: pnpm run audit:consumer
