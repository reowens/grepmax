name: CI

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify change classification
        run: node --test scripts/test-ci-changes.cjs
      - name: Select checks from the complete diff
        id: scope
        run: node scripts/ci-changes.cjs

  ci:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    # A docs-only push skips this job, so it cannot cancel unfinished source CI.
    # New source checks supersede old ones; explicit dispatches stay independent.
    concurrency:
      group: ci-linux-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; audited bootstrap pnpm 11.25.0
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup locked prune runtime tooling
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.18'

      - name: Audit JavaScript dependencies including development tools
        run: pnpm audit

      - name: Audit Python lockfile without loading models
        run: pnpm run audit:python

      - name: Test Python audit gate
        run: pnpm run test:python

      - name: Check types
        run: pnpm run typecheck

      - name: Check test types
        run: pnpm run test:typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Verify read-only CI usage reporting
        run: node --test scripts/test-ci-usage.cjs scripts/test-ci-billing.cjs scripts/test-depot-usage.cjs

      - name: Run tests
        run: pnpm exec vitest run --maxWorkers=2

      - name: Build
        run: pnpm run build

      - name: Audit and smoke-test the packed npm consumer
        run: pnpm run audit:consumer

  watcher-macos:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    concurrency:
      group: ci-macos-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Native FSEvents, gap recovery, ignore policies and queue priority
        run: pnpm exec vitest run tests/watcher-manager.test.ts tests/standalone-watcher-health.test.ts tests/project-watcher-ignore.test.ts tests/watcher-ignore.test.ts tests/watcher-batch.test.ts tests/project-batch-processor.test.ts --maxWorkers=2
      - run: pnpm run build
      - name: Qualify native macOS watcher recovery without models
        run: node --max-old-space-size=384 scripts/test-watcher-consumer.cjs
