name: Publish reviewed release
run-name: Publish grepmax ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version (without v)
        required: true
        type: string
      source_commit:
        description: Full reviewed source commit
        required: true
        type: string
      archive_sha256:
        description: SHA256 of the qualified archive attached to the draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grepmax-npm-publication
  cancel-in-progress: false

jobs:
  publish-npm:
    if: github.repository == 'reowens/grepmax' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REVIEWED_SOURCE: ${{ inputs.source_commit }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - name: Checkout publication source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested release and unchanged product source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          version, source, digest = (os.environ[k] for k in ('RELEASE_VERSION', 'REVIEWED_SOURCE', 'ARCHIVE_SHA256'))
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Invalid version'
          assert re.fullmatch(r'[a-f0-9]{40}', source), 'Invalid source commit'
          assert re.fullmatch(r'[a-f0-9]{64}', digest), 'Invalid archive checksum'
          assert json.load(open('package.json'))['version'] == version, 'Checkout version differs'
          tag = subprocess.check_output(['git', 'rev-parse', f'v{version}^{{}}'], text=True).strip()
          assert tag == source, 'Release tag differs from reviewed source'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, 'HEAD'], check=True)
          protected = ['src', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'README.md', 'LICENSE', 'NOTICE', 'DOCUMENT-SEARCH.md', 'licenses', 'plugins', '.claude-plugin', 'mlx-embed-server', 'lance-maintenance', 'scripts/prepare-lance-runtime.cjs', 'scripts/prepare-bounded-runtime.cjs', 'scripts/bounded-source-digest.cjs', 'scripts/postinstall.js']
          subprocess.run(['git', 'diff', '--exit-code', source, 'HEAD', '--', *protected], check=True)
          print(f'Validated reviewed source {source}, version {version}, archive {digest}', flush=True)
          PY

      - name: Download qualified archive and source receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" \
            --pattern "grepmax-${RELEASE_VERSION}.tgz" --pattern release-SOURCE-ARTIFACT.json \
            --dir "$RUNNER_TEMP/approved"

      - name: Verify approved bytes and recover qualified native payloads
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'approved'
          version, source, digest = (os.environ[k] for k in ('RELEASE_VERSION', 'REVIEWED_SOURCE', 'ARCHIVE_SHA256'))
          archive = root / f'grepmax-{version}.tgz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest, 'Approved archive checksum differs'
          receipt = json.loads((root / 'release-SOURCE-ARTIFACT.json').read_text())
          expected = {'version': version, 'sourceCommit': source, 'gitTag': f'v{version}', 'archive': archive.name, 'sha256': digest}
          assert all(receipt.get(k) == v for k, v in expected.items()), 'Source/archive receipt differs'
          native = root / 'native'
          native.mkdir()
          with tarfile.open(archive) as package:
              manifest = json.load(package.extractfile('package/package.json'))
              assert manifest['name'] == 'grepmax' and manifest['version'] == version
              for name in ['manifest.json', 'acceptance.json', 'THIRD-PARTY-NOTICES.txt', 'gmax-bounded-maintenance-darwin-arm64', 'gmax-bounded-maintenance-linux-x64']:
                  entry = package.getmember('package/dist/vendor/maintenance/' + name)
                  assert entry.isfile(), 'Native payload is not a regular file'
                  (native / name).write_bytes(package.extractfile(entry).read())
          print(f'Approved archive verified: {digest}; qualified native payloads retained', flush=True)
          PY

      - name: Set up matching Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '26.12.0'
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.4.2'
          run_install: false

      - name: Match npm packer and install locked build tools
        run: |
          npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build on hosted runner and require identical archive
        run: |
          node scripts/prepare-lance-runtime.cjs
          pnpm exec tsc
          chmod +x dist/bin.js dist/index.js
          node scripts/prepare-bounded-runtime.cjs "$RUNNER_TEMP/approved/native" dist/vendor/maintenance --required
          mkdir "$RUNNER_TEMP/rebuilt"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/rebuilt" > "$RUNNER_TEMP/pack.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((root / 'pack.json').read_text())[0]
          assert metadata['filename'] == f"grepmax-{os.environ['RELEASE_VERSION']}.tgz"
          archive = root / 'rebuilt' / metadata['filename']
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != os.environ['ARCHIVE_SHA256']:
              def entries(path):
                  with tarfile.open(path) as package:
                      return [(item.name, item.type.decode('ascii'), item.mode, item.uid, item.gid, item.mtime,
                               hashlib.sha256(package.extractfile(item).read()).hexdigest() if item.isfile() else item.linkname)
                              for item in package]
              approved_entries = entries(root / 'approved' / metadata['filename'])
              rebuilt_entries = entries(archive)
              approved_by_name = {item[0]: item[1:] for item in approved_entries}
              rebuilt_by_name = {item[0]: item[1:] for item in rebuilt_entries}
              for name in sorted(approved_by_name.keys() | rebuilt_by_name.keys()):
                  before, after = approved_by_name.get(name), rebuilt_by_name.get(name)
                  if before != after:
                      print(json.dumps({'path': name, 'approved': before, 'rebuilt': after}), flush=True)
              print(f'Archive entry order matches: {[item[0] for item in approved_entries] == [item[0] for item in rebuilt_entries]}', flush=True)
              raise AssertionError(f'Hosted archive differs from approved bytes: {actual}')
          print(f'Hosted build exactly matches approved archive: {actual}', flush=True)
          PY

      - name: Publish through existing npm trusted publisher
        run: npm publish "$RUNNER_TEMP/rebuilt/grepmax-${RELEASE_VERSION}.tgz" --ignore-scripts --access=public --registry=https://registry.npmjs.org --provenance

      - name: Verify registry bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request
          version, expected = os.environ['RELEASE_VERSION'], os.environ['ARCHIVE_SHA256']
          endpoint = f'https://registry.npmjs.org/grepmax/{version}'
          deadline = time.monotonic() + 480
          while True:
              try:
                  with urllib.request.urlopen(endpoint, timeout=20) as response:
                      metadata = json.load(response)
                  assert metadata['version'] == version
                  assert metadata['dist']['tarball'] == f'https://registry.npmjs.org/grepmax/-/grepmax-{version}.tgz'
                  with urllib.request.urlopen(metadata['dist']['tarball'], timeout=60) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  assert actual == expected, f'Registry bytes differ: {actual}'
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404 or time.monotonic() >= deadline:
                      raise
                  print('Publication accepted; waiting for registry propagation...', flush=True)
                  time.sleep(15)
          print(f'Public grepmax@{version} verified: {actual}', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Published grepmax {version}\n\nReviewed source: `{os.environ["REVIEWED_SOURCE"]}`\n\nArchive SHA256: `{actual}`\n\nHosted build and public registry exactly match the approved archive.\n')
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
