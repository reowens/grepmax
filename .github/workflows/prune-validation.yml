name: Isolated prune validation
on:
  push:
    branches: [test/gmax-prune-validation, fix/gmax-prune-integration, fix/gmax-recovery-admission]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.18'
      - run: pnpm install --frozen-lockfile
      - name: Audit pinned cleanup runtime without loading it
        run: python3 scripts/audit-python.py --lockfile lance-maintenance/uv.lock
      - name: Prepare locked wheels with existing Python only
        run: uv sync --locked --project lance-maintenance --no-dev --no-build --no-python-downloads --python "$(command -v python3)"
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/gmax-prune-python
      - name: Validate bounded deleted-row materialization
        run: ${{ runner.temp }}/gmax-prune-python/bin/python -I tests/python/test_compact_recovery.py
      - name: Guard and lease regressions
        run: |
          python3 -m unittest discover -s tests/python -p test_lance_prune.py
          pnpm exec vitest run tests/lance-cleanup.test.ts tests/store-lease.test.ts tests/recovery-admission.test.ts tests/recovery.test.ts tests/resource-budget.test.ts --maxWorkers=1
      - name: Build and verify the installed npm package
        run: |
          pnpm run build
          pnpm run audit:consumer
          mkdir -p "$RUNNER_TEMP/prune-evidence"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/prune-evidence"
      - name: Create isolated fixture volume
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/prune-evidence"
          fixture_base="$RUNNER_TEMP/gmax-prune-fixtures"
          mkdir "$fixture_base"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test "$(uname -m)" = arm64
            hdiutil create -size 6g -type SPARSE -fs APFS -volname GmaxPruneFixture "$RUNNER_TEMP/gmax-prune-fixture.sparseimage"
            hdiutil attach -nobrowse -mountpoint "$fixture_base" "$RUNNER_TEMP/gmax-prune-fixture.sparseimage"
            diskutil info -plist "$fixture_base" > "$RUNNER_TEMP/prune-evidence/filesystem.plist"
            python3 -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); assert d["FilesystemType"] == "apfs"; print(d)' "$RUNNER_TEMP/prune-evidence/filesystem.plist"
          fi
          echo "GMAX_PRUNE_FIXTURE_BASE=$fixture_base" >> "$GITHUB_ENV"
          echo "GMAX_PRUNE_EVIDENCE=$RUNNER_TEMP/prune-evidence" >> "$GITHUB_ENV"
      - name: Preserve exact released reader for mixed-version lease acceptance
        run: |
          git fetch --depth=1 --no-tags origin f65415fa639624a5eb2e62e0e8997b38bd3f7066
          git show f65415fa639624a5eb2e62e0e8997b38bd3f7066:src/lib/store/store-lease.ts > scripts/.prune-legacy-store-lease.ts
      - name: Verify recovery, native interruption, lease recovery and resource use
        # Mixed-version clients must honor helper ownership after parent death.
        shell: bash
        run: node --max-old-space-size=256 --import tsx scripts/test-prune-native.cjs | tee "$GMAX_PRUNE_EVIDENCE/native.jsonl"
        env:
          PRUNE_PYTHON: ${{ runner.temp }}/gmax-prune-python/bin/python
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prune-validation-${{ matrix.runner }}
          path: ${{ runner.temp }}/prune-evidence
          if-no-files-found: error
      - name: Unmount task-owned fixture volume
        if: always() && runner.os == 'macOS'
        run: |
          if mount | grep -F "$RUNNER_TEMP/gmax-prune-fixtures"; then
            hdiutil detach "$RUNNER_TEMP/gmax-prune-fixtures"
          fi
