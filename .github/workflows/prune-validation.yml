name: Isolated prune validation
on:
  push:
    branches: [test/gmax-prune-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.18'
      - run: pnpm install --frozen-lockfile
      - name: Audit pinned cleanup runtime without loading it
        run: python3 scripts/audit-python.py --lockfile lance-maintenance/uv.lock
      - name: Prepare locked wheels with existing Python only
        run: uv sync --locked --project lance-maintenance --no-dev --no-build --no-python-downloads --python /usr/bin/python3
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/gmax-prune-python
      - name: Guard and lease regressions
        run: |
          python3 -m unittest discover -s tests/python -p test_lance_prune.py
          pnpm exec vitest run tests/lance-cleanup.test.ts tests/store-lease.test.ts --maxWorkers=1
      - name: Verify 600000 rows, multiple fragments, deletions, tags and partial FTS
        run: node --max-old-space-size=256 --import tsx scripts/test-prune-native.cjs
        env:
          PRUNE_PYTHON: ${{ runner.temp }}/gmax-prune-python/bin/python
