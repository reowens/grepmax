name: CI

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:
  push:
    branches: [ main, fix/gmax-prune-integration, fix/gmax-recovery-admission ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; audited bootstrap pnpm 11.25.0
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup locked prune runtime tooling
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.18'

      - name: Audit JavaScript dependencies including development tools
        run: pnpm audit

      - name: Audit Python lockfile without loading models
        run: pnpm run audit:python

      - name: Test Python audit gate
        run: pnpm run test:python

      - name: Check types
        run: pnpm run typecheck

      - name: Check test types
        run: pnpm run test:typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        run: pnpm exec vitest run --maxWorkers=2

      - name: Build
        run: pnpm run build

      - name: Audit and smoke-test the packed npm consumer
        run: pnpm run audit:consumer
