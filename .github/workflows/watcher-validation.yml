name: Native watcher validation

on:
  workflow_dispatch:
  push:
    branches: [main, fix/gmax-watcher-recovery]
    paths:
      - 'src/lib/daemon/watcher-manager.ts'
      - 'src/lib/index/watcher*.ts'
      - 'tests/*watcher*.test.ts'
      - '.github/workflows/watcher-validation.yml'

jobs:
  watcher:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run test:typecheck
      - name: Native FSEvents, gap recovery, ignore policies and queue priority
        run: pnpm exec vitest run tests/watcher-manager.test.ts tests/standalone-watcher-health.test.ts tests/project-watcher-ignore.test.ts tests/watcher-ignore.test.ts tests/watcher-batch.test.ts tests/project-batch-processor.test.ts --maxWorkers=2
