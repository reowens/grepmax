[project]
name = "mlx-embed-server"
version = "0.1.0"
description = "MLX-accelerated embedding and summarization server for grepmax"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings.git@9b28270be81211f2b8daed0041aec65ea5dc4b28",
    "mlx-lm>=0.32.2",
    "setproctitle>=1.3.8",
]

[project.scripts]
mlx-embed-server = "server:main"
mlx-summarizer = "summarizer:main"

[tool.uv]
# Advisory patch floors for the HTTP/TLS, model and utility dependency trees.
# Constraints do not install otherwise-unused packages or change model weights.
# Keep these floors when refreshing the lock; npm audits do not cover Python.
constraint-dependencies = [
    "aiohttp>=3.14.5",
    "anyio>=4.15.1",
    "certifi>=2026.10.23",
    "click>=8.5.0",
    "datasets>=5.1.0",
    "filelock>=4.2.4",
    "fsspec>=2026.6.0", # GHSA-27vj-qcqg-25rc; datasets 5.1.0 caps fsspec at 2026.7.0.
    "idna>=3.20",
    "multidict>=6.9.1",
    "pillow>=13.0.0",
    "pygments>=2.21.0",
    "requests>=2.34.2",
    "starlette>=1.10.0",
    "transformers>=5.21.1", # Preserve the floor above yanked 5.10.0.
    "urllib3>=2.8.0",
]
