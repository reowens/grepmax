[project]
name = "gmax-gemma2-embedding"
version = "0.1.0"
description = "Optional text-only EmbeddingGemma 2 backend for isolated Mac profiles"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "setproctitle>=1.3.8",
    "mlx==0.32.4",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@763e6379a94d054b8d695d6f3f3ad675d3d366df",
    "transformers==5.22.2",
]

[tool.uv]

# Advisory patch floors for the HTTP/TLS, model and utility dependency trees.
# Constraints do not install otherwise-unused packages or change model weights.
# Keep these floors when refreshing the lock; npm audits do not cover Python.
constraint-dependencies = [
    "aiohttp>=3.14.5",
    "anyio>=4.15.1",
    "certifi>=2026.10.23",
    "click>=8.5.0",
    "datasets>=5.1.0",
    "fsspec>=2026.6.0", # GHSA-27vj-qcqg-25rc
    "idna>=3.20",
    "multidict>=6.9.1",
    "pillow>=13.0.0",
    "pygments>=2.21.0",
    "requests>=2.34.2",
    "starlette>=1.10.0",
    "transformers>=5.10.1", # 5.10.0 was yanked by its maintainers.
    "urllib3>=2.8.0",
]
