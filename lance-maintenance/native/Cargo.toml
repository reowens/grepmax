[package]
name = "gmax-bounded-maintenance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lance = { version = "=12.0.0", default-features = false, optional = true }
lance-io = { version = "=12.0.0", default-features = false, optional = true }
object_store = { version = "=0.14.1", default-features = false, features = ["fs"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
anyhow = "1"
arrow-array = { version = "58", optional = true }
arrow-ipc = { version = "58", optional = true }
arrow-schema = { version = "58", features = ["serde"], optional = true }
arrow-row = { version = "58", optional = true }
lance-table = { version = "=12.0.0", default-features = false, optional = true }
lance-index = { version = "=12.0.0", default-features = false, optional = true }
libc = "0.2"

[features]
default = []
engine = ["dep:lance", "dep:lance-io", "dep:lance-table", "dep:lance-index", "dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:arrow-row"]

[[bin]]
name = "gmax-bounded-maintenance"
path = "src/main.rs"
required-features = ["engine"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
