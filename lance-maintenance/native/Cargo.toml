[package]
name = "gmax-bounded-maintenance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lance = { version = "=14.0.2", default-features = false, optional = true }
lance-io = { version = "=14.0.2", default-features = false, optional = true }
object_store = { version = "=0.14.2", default-features = false, features = ["fs"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11"
anyhow = "1"
arrow-select = { version = "58", optional = true }
arrow-array = { version = "58", optional = true }
arrow-ipc = { version = "58", optional = true }
arrow-schema = { version = "58", features = ["serde"], optional = true }
arrow-row = { version = "58", optional = true }
lance-table = { version = "=14.0.2", default-features = false, optional = true }
lance-index = { version = "=14.0.2", default-features = false, optional = true }
libc = "0.2"
uuid = { version = "=1.29.2", features = ["v4"], optional = true }
prost = { version = "=0.14.4", optional = true }

[features]
default = []
engine = ["dep:lance", "dep:lance-io", "dep:lance-table", "dep:lance-index", "dep:arrow-array", "dep:arrow-select", "dep:arrow-ipc", "dep:arrow-schema", "dep:arrow-row", "dep:prost", "dep:uuid"]
qualification = []

[[bin]]
name = "gmax-bounded-maintenance"
path = "src/main.rs"
required-features = ["engine"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Symbol tables were 80 of the 273 MB a Lance 14 build linked to, over the
# 256 MiB a shipped helper may be. Panics still name their source line.
[profile.release]
strip = "symbols"
