# pnpm reads overrides from here, not from package.json's top-level `overrides`
# (that field is npm-only, and it is ignored entirely when a package is consumed
# as a dependency). Putting the mathjs pin there silently un-pinned it.
overrides:
  mathjs: "15.2.0"
  # In-range advisory patches for transitive dependencies.
  fast-uri: "^3.1.8" # .>@modelcontextprotocol/client>ajv
  source-map-js: "^1.2.2" # Vite/Vitest > PostCSS; GHSA-68fv-2mgg-jv7q
  # Legacy client fixture only: keep its unused HTTP dependencies patched in dev.
  qs: "^6.16.0"
  ip-address: "^10.7.1"
  hono: "^4.13.5"
  "@hono/node-server": "^2.0.5"
  protobufjs: "^7.6.5" # .>@huggingface/transformers>onnxruntime-web
  undici: "^8.10.2" # .>openai (peer >=5 <9)
  # These two force past the parent's range, so they need justifying:
  # sharp — @huggingface/transformers declares ^0.35.4; patch needs >=0.35.5.
  # Safe here because transformers is in ignoredOptionalDependencies and gmax
  # embeds via onnxruntime-node; sharp's image path is never entered.
  sharp: "^0.35.5"
  # adm-zip — onnxruntime-node declares ^0.6.0, patch needs >=0.6.1. Used only
  # by that package's install script, which allowBuilds suppresses.
  adm-zip: "^0.6.1"

ignoredOptionalDependencies:
  - "@huggingface/transformers"
  - openai

# Only @parcel/watcher runs its build script. numkong ships prebuilt platform
# binaries, so no local build is needed.
allowBuilds:
  "@parcel/watcher": true
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  numkong: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# transformers 4.3.0 pins onnxruntime-node 1.30.0, which dedupes ort. With two
# copies, Linux loads 1.24.3's libonnxruntime.so.1 under the 1.30.0 binding and
# fails with VERS_1.30.0 not found. Remove once 4.3.0 is past the release-age window.
minimumReleaseAgeExclude:
  - '@huggingface/transformers@4.3.0'
  # Explicitly requested SDK v2 migration; exact tested server/client/core pins.
  - '@modelcontextprotocol/core@2.3.0'
  - '@modelcontextprotocol/server@2.3.0'
  - '@modelcontextprotocol/client@2.3.0'
