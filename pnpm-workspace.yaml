# pnpm reads overrides from here, not from package.json's top-level `overrides`
# (that field is npm-only, and it is ignored entirely when a package is consumed
# as a dependency). Putting the mathjs pin there silently un-pinned it.
overrides:
  mathjs: "15.2.0"
  # In-range advisory patches for transitive dependencies.
  fast-uri: "^3.1.9" # Legacy MCP fixture > ajv
  source-map-js: "^1.2.2" # Vite/Vitest > PostCSS; GHSA-68fv-2mgg-jv7q
  # Legacy client fixture only: keep its unused HTTP dependencies patched in dev.
  qs: "^6.17.1"
  ip-address: "^10.7.4"
  hono: "^4.13.14"
  "@hono/node-server": "^2.1.5"
  protobufjs: "^7.6.5" # .>@huggingface/transformers>onnxruntime-web
  undici: "^8.12.2" # node-gyp; openai optional peer >=5 <9
  # These two force past the parent's range, so they need justifying:
  # sharp — @huggingface/transformers declares ^0.35.4; patch needs >=0.35.5.
  # Safe here because transformers is in ignoredOptionalDependencies and gmax
  # embeds via onnxruntime-node; sharp's image path is never entered.
  sharp: "^0.35.5"
  # adm-zip — onnxruntime-node declares ^0.6.0, patch needs >=0.6.1. Used only
  # by that package's install script, which allowBuilds suppresses.
  adm-zip: "^0.6.1"

ignoredOptionalDependencies:
  - "@huggingface/transformers"
  - openai

# Only @parcel/watcher runs its build script. numkong ships prebuilt platform
# binaries, so no local build is needed.
allowBuilds:
  "@parcel/watcher": true
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  numkong: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# transformers 4.3.2 pins onnxruntime-node 1.30.0, which dedupes ort. With two
# copies, Linux loads 1.24.3's libonnxruntime.so.1 under the 1.30.0 binding and
# fails with VERS_1.30.0 not found. Remove once 4.3.2 is past the release-age window.
minimumReleaseAgeExclude:
  - '@huggingface/transformers@4.3.2'
  # Explicit minor dependency update; keep server/client/core pins aligned.
  - '@modelcontextprotocol/core@2.4.0'
  - '@modelcontextprotocol/server@2.4.0'
  - '@modelcontextprotocol/client@2.4.0'
  - '@biomejs/biome@2.6.4'
  - '@biomejs/cli-android-arm64@2.6.4'
  - '@biomejs/cli-android-x64@2.6.4'
  - '@biomejs/cli-darwin-arm64@2.6.4'
  - '@biomejs/cli-darwin-x64@2.6.4'
  - '@biomejs/cli-linux-arm64-musl@2.6.4'
  - '@biomejs/cli-linux-arm64@2.6.4'
  - '@biomejs/cli-linux-x64-musl@2.6.4'
  - '@biomejs/cli-linux-x64@2.6.4'
  - '@biomejs/cli-win32-arm64@2.6.4'
  - '@biomejs/cli-win32-x64@2.6.4'
  - '@types/node@26.6.6'
  - qs@6.17.1
  - '@lancedb/lancedb-darwin-arm64@0.41.0'
  - '@lancedb/lancedb-linux-arm64-gnu@0.41.0'
  - '@lancedb/lancedb-linux-arm64-musl@0.41.0'
  - '@lancedb/lancedb-linux-x64-gnu@0.41.0'
  - '@lancedb/lancedb-linux-x64-musl@0.41.0'
  - '@lancedb/lancedb-win32-arm64-msvc@0.41.0'
  - '@lancedb/lancedb-win32-x64-msvc@0.41.0'
  - '@lancedb/lancedb@0.41.0'
